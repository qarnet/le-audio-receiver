name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (native_sim)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Install Python and west
        run: |
          pip3 install west

      - name: West init and update
        working-directory: app
        run: |
          west init -l .
          west update --narrow --fetch-opt=--depth=1

      - name: Install Zephyr SDK (minimal, x86_64 only)
        run: |
          ZSDK_VERSION=0.17.0
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZSDK_VERSION}/zephyr-sdk-${ZSDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar xf "zephyr-sdk-${ZSDK_VERSION}_linux-x86_64_minimal.tar.xz" -C /opt
          /opt/zephyr-sdk-${ZSDK_VERSION}/setup.sh -t x86_64-zephyr-elf -c

      - name: Install Python requirements
        working-directory: app
        run: |
          ZEPHYR_BASE="$(west topdir)/zephyr"
          pip3 install -r "${ZEPHYR_BASE}/scripts/requirements-base.txt"
          pip3 install -r "${ZEPHYR_BASE}/scripts/requirements-build-test.txt"

      - name: Run unit tests
        working-directory: app
        run: |
          export ZEPHYR_BASE="$(west topdir)/zephyr"
          export ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.17.0
          west twister \
            -T tests/unit/drift \
            -p native_sim/native \
            --inline-logs \
            -v \
            --no-clean

      - name: Upload Twister results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: app/twister-out/
