# Minimal FLPR config: IPC service + ICMsg backend, no console, no shell.
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_ICMSG=y
CONFIG_MBOX=y

# ICMsg buffer: must match CPUAPP config exactly.
CONFIG_IPC_SERVICE_BACKEND_ICMSG_ME_SEND_BUF_SIZE=512

# GRTC for k_cycle_get_32() hardware epoch (non-zero, monotonic).
CONFIG_NRFX_GRTC=y

# Logging (minimal, no UART backend — only IPC).
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Small heap for IPC service internal allocations
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Ring processing needs stack buffer; increase main thread stack
CONFIG_MAIN_STACK_SIZE=4096

# Disable unused subsystems
CONFIG_PRINTK=n
CONFIG_SHELL=n
CONFIG_SERIAL=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_CONSOLE=n
