# nRF54L15 — single-core, SDC on cpuapp, no hci_ipc transport.
# Reference: ~/ncs/v3.3.0/nrf/samples/bluetooth/iso_time_sync

# Sink-only: RX buffers matter, TX counts irrelevant.
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_CONN_TX_MAX=3
CONFIG_BT_ISO_TX_BUF_COUNT=1
CONFIG_BT_ISO_RX_BUF_COUNT=3
CONFIG_BT_ISO_RX_MTU=251

# SDC controller defaults are fine for unicast sink, except the ISO TX HCI
# buffer count: SDC defaults to 3 but we are sink-only (1 TX context).
# Match them to silence the boot warning and avoid over-allocating.
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=1

# Clock actuator: sample insert/drop (no HFCLKAUDIO on nRF54L15).
# Phase 5: resampler handles correction directly; keep SAMPLE_ADJUST
# for A/B comparison until ASRC acceptance.  Switch to ASRC_LINEAR
# by changing AUDIO_RESAMPLER and removing SAMPLE_ADJUST.
CONFIG_AUDIO_RESAMPLER_ASRC_LINEAR=y
# CONFIG_AUDIO_CLOCK_ACTUATOR_SAMPLE_ADJUST is not set — ASRC consumes
# controller ppm directly.  Keep the actuator choice on APLL (default)
# which is a no-op on nRF54L15 but preserves the Kconfig structure.

# Actual I2S LRCK with PCLK32M clock source (measured ~47619 Hz).
# The rate converter matches decoder 48k output to this drain rate.
CONFIG_AUDIO_I2S_OUTPUT_SAMPLE_RATE_HZ=47619

# Phase 4b.1: nrfx drivers for GRTC+GPPI hardware timing measurement.
# TIMER20 is accessed through nrf_timer HAL (DT-derived base address)
# and does not require CONFIG_NRFX_TIMER.
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_GRTC=y

# Phase 4b.2: PI controller clamps for SAMPLE_ADJUST actuator.
# SAMPLE_ADJUST capacity is ±~2083 ppm (one sample per 480-frame block).
# Headroom of ~300 ppm above measured ~+1775 ppm PCLK offset.
CONFIG_AUDIO_DRIFT_OUTPUT_CLAMP=2000
# Phase authority: 150 ppm prevents phase PI from consuming all
# feedforward headroom around the ~1775 ppm fixed PCLK offset.
CONFIG_AUDIO_DRIFT_PHASE_INTEGRAL_CLAMP=150

# Phase 5.0: enable performance instrumentation for SAMPLE_ADJUST baseline.
# Deadline = 10000 us (10 ms), converted to cycles at runtime.
CONFIG_AUDIO_PERF_MEASUREMENT=y
