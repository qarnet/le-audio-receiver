# nRF54L15 — single-core, SDC on cpuapp, no hci_ipc transport.
# Reference: ~/ncs/v3.3.0/nrf/samples/bluetooth/iso_time_sync

# RF antenna switch power/control for Xiao nRF54L15 ceramic antenna.
# Drives P2.03 high (rfsw_pwr) and P2.05 low (rfsw_ctl) at boot
# before Bluetooth starts via the regulator-fixed nodes in the
# devicetree overlay. Without this, antenna path is open → ~-96 dBm.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_INIT_PRIORITY=45

# Sink-only: RX buffers matter, TX counts irrelevant.
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_CONN_TX_MAX=3
CONFIG_BT_ISO_TX_BUF_COUNT=1
CONFIG_BT_ISO_RX_BUF_COUNT=3
CONFIG_BT_ISO_RX_MTU=251

# SDC controller defaults are fine for unicast sink, except the ISO TX HCI
# buffer count: SDC defaults to 3 but we are sink-only (1 TX context).
# Match them to silence the boot warning and avoid over-allocating.
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=1

# Phase 5 production: linear ASRC handles rate mismatch + drift ppm.
# Actuator NONE — no HFCLKAUDIO on nRF54L15; ASRC consumes ppm directly.
CONFIG_AUDIO_RESAMPLER_ASRC_LINEAR=y
CONFIG_AUDIO_CLOCK_ACTUATOR_NONE=y

# Route decoded PCM through FLPR ASRC.
# On any fault, cpuapp ASRC runs as fallback with no audio drop.
CONFIG_AUDIO_OFFLOAD_ASRC=y

# Actual I2S LRCK with PCLK32M clock source (measured ~47619 Hz).
CONFIG_AUDIO_I2S_OUTPUT_SAMPLE_RATE_HZ=47619

# nrfx drivers for GRTC+GPPI hardware timing measurement.
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_GRTC=y

# PI controller clamps for nRF54L15.
# 2000 ppm output + 150 ppm phase authority leaves headroom around
# the measured ~+1775 ppm PCLK offset.
CONFIG_AUDIO_DRIFT_OUTPUT_CLAMP=2000
CONFIG_AUDIO_DRIFT_PHASE_INTEGRAL_CLAMP=150

# Enable performance instrumentation.
CONFIG_AUDIO_PERF_MEASUREMENT=y

# ── FLPR IPC (boot handshake transport) ──
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
# SRAM budget: CONFIG_HEAP_MEM_POOL_SIZE reduced 4096 → 0 (proven
# unused). Resolved-build map evidence: the only k_malloc/k_heap_alloc
# consumer linked into the nRF54L15 app is zephyr/lib/net_buf buf.c,
# and net_buf's heap data allocator (net_buf_heap_cb) is compiled only
# under K_HEAP_MEM_POOL_SIZE > 0 and is referenced by NO net_buf pool
# in the build (all BT pools are fixed-size); shell history uses its own
# dedicated K_HEAP_DEFINE (CONFIG_SHELL_HISTORY_BUFFER), not the system
# heap. No other object references k_malloc/k_free/_k_sys_heap (map
# grep). With the heap at 0 the net_buf heap path is not even compiled.
# P8 hardware acceptance re-checked runtime (no allocation failure
# across all streams); the build contract pins
# CONFIG_HEAP_MEM_POOL_SIZE=0.
CONFIG_HEAP_MEM_POOL_SIZE=0
# PBUF read buffer must be large enough to drain accumulated messages.
# Default 128 is too small after >16 heartbeats at 1 Hz.
CONFIG_PBUF_RX_READ_BUF_SIZE=512

# Memory layout fix: ICMsg shared region at 0x20028000..0x20030000
# is now above CPUAPP SRAM (0x20000000..0x20028000). The previous
# region at 0x20018000 overlapped CPUAPP .noinit/Bluetooth allocations.
# With non-overlapping memory, the ICMsg PBUF assertion should not fire.
# CONFIG_ASSERT=y is the global default (prj.conf).

# FLPR acceptance-harness shell commands (flpr ring *, flpr stress,
# flpr hang) are gated behind CONFIG_AUDIO_ACCEPTANCE_DIAGNOSTICS so
# normal audio diagnostics never compile the acceptance harness.
# nRF5340 leaves it disabled (no FLPR acceptance commands).
CONFIG_AUDIO_ACCEPTANCE_DIAGNOSTICS=y

# ── User pairing control (P6) ──
# Full feature stack enabled ONLY on nRF54L15 (the production XIAO
# target). The nRF5340 board conf/prj keep both symbols off — its
# behavior stays byte-for-byte feature-off (build contract asserts
# CONTROL/INPUT not enabled there).
# Hardware is selected by the devicetree aliases in the nRF54L15
# overlay: user-button = P0.00 (pull-up, active-low), user-led = P2.00
# (active-low). gpio-keys owns the 30 ms debounce.
CONFIG_USER_PAIRING_CONTROL=y
CONFIG_USER_PAIRING_INPUT=y
# INPUT=y is the mandatory subsystem dependency of USER_PAIRING_INPUT
# (menuconfig, default n, nothing selects it; the gpio-keys driver
# INPUT_GPIO_KEYS only selects GPIO). Without it Kconfig warns
# "assigned the value 'y' but got the value 'n'" and the build-contract
# INPUT=y assertion fails.
CONFIG_INPUT=y
CONFIG_USER_PAIRING_DEBOUNCE_MS=30
CONFIG_USER_PAIRING_SHELL_RESET_TIMEOUT_MS=15000
# Dedicated pairing work-queue stack, 1536 B.  P8 hardware originally
# validated 1024 (usage 640/1024 (62 %) at idle), but FR4 cadence
# hardware measured a pre-fix high-water of 1012/1024 (98 %, 12 B
# unused) on this queue, which is not acceptable margin for the
# RESET/BONDING/feedback/blink/security/advertising transition work it
# owns.  1536 makes the observed high-water about 66 % of the stack,
# restoring an expected 524 B margin.  RAM headroom: nRF54L15 cpuapp
# used 161084 B of 160 KB (98.32 %) before this change, leaving 2756 B;
# the extra 512 B leaves about 2244 B before alignment/build variation.
# 2048 would consume another full kilobyte without need.
CONFIG_USER_PAIRING_WORKQ_STACK_SIZE=1536
