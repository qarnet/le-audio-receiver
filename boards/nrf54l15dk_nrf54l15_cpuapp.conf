# nRF54L15 — single-core, BT controller on cpuapp, no hci_ipc transport.
# Buffer counts are not constrained by a separate controller image.
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_CONN_TX_MAX=4
CONFIG_BT_ISO_TX_BUF_COUNT=4

# No HFCLKAUDIO on nRF54L15 — MCK bypass not applicable
# CONFIG_I2S_NRFX_ALLOW_MCK_BYPASS is not set

# No APLL on nRF54L15 — use no-actuator (Phase 4 adds sample_adjust)
CONFIG_AUDIO_CLOCK_ACTUATOR_NONE=y
