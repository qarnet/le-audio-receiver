# Ebyte E83-2G4M03S nRF5340 app core — board-specific Kconfig.
# Auto-discovered by Zephyr for the ebyte_e83_nrf5340/nrf5340/cpuapp target.

# I2S0 runs without MCK (CJMCU-1334 / UDA1334A uses its internal PLL to lock
# to BCLK). Not applicable on nRF54L15 (no HFCLKAUDIO) — keep here, out of
# the shared prj.conf, so the nRF54L15 build does not emit a Kconfig warning.
CONFIG_I2S_NRFX_ALLOW_MCK_BYPASS=y

# NRF WDT driver — nRF5340 has wdt with status="okay" in DT.
# nRF54L15 has wdt30/wdt31 both disabled in DT when SDC/MPSL is in use,
# so this symbol must be board-specific to avoid a Kconfig warning there.
CONFIG_WDT_NRFX=y

# Phase 5: identity resampler (memcpy passthrough) + APLL actuator.
# APLL handles clock drift at the hardware level.
CONFIG_AUDIO_RESAMPLER_IDENTITY=y
CONFIG_AUDIO_CLOCK_ACTUATOR_APLL=y

# System workqueue stack 2048 bytes (FR4 hardware fault fix).
# Hardware evidence: fresh strict-mono stream establishment on nRF5340 hit
# `USAGE FAULT` / `Stack overflow (context area not valid)` / ZEPHYR FATAL
# ERROR 2 on `sysworkq` with the 1024-byte resolved stack, at the fresh
# Config/QoS transition before Enable/ISO callback.
# Selected budget: 2048 bytes (1 KB cost; observed 448 KB RAM region at
# 31.67 % used, ample headroom).  Conservative smallest doubling and matches
# the nRF54L15 target, which already resolves 2048 and needs no config change.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
