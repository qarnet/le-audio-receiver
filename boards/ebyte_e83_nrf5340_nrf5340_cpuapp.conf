# Ebyte E83-2G4M03S nRF5340 app core — board-specific Kconfig.
# Auto-discovered by Zephyr for the ebyte_e83_nrf5340/nrf5340/cpuapp target.

# I2S0 runs without MCK (CJMCU-1334 / UDA1334A uses its internal PLL to lock
# to BCLK). Not applicable on nRF54L15 (no HFCLKAUDIO) — keep here, out of
# the shared prj.conf, so the nRF54L15 build does not emit a Kconfig warning.
CONFIG_I2S_NRFX_ALLOW_MCK_BYPASS=y