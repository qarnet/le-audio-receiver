CONFIG_ZTEST=y
CONFIG_FPU=y
CONFIG_LIBLC3=y
CONFIG_CRC=y
CONFIG_AUDIO_PERF_MEASUREMENT=y
CONFIG_BSIM_OBSERVER=y
CONFIG_BSIM_SINK_POOL_LIMIT=2

# bsim_observer.h includes the Zephyr BT audio headers, which require the
# BT buffer-count configs to be defined (static asserts in buf.h).  No BT
# functions are called by the suite; CONFIG_BT is enabled only so the
# header contract (enum types used by the observer API) compiles.
CONFIG_BT=y
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_ACL_TX_COUNT=7
CONFIG_BT_CONN_TX_MAX=7
CONFIG_BT_ISO_TX_BUF_COUNT=6
