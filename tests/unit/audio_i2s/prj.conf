# I2S sink state-machine suite (ASRC/NONE/offload variant).
# Variant selection (ASRC_LINEAR, NONE actuator, offload, 47619 Hz) is
# applied via test-only compile definitions in CMakeLists.txt — these
# symbols are not defined in this app's Kconfig, so they must not be
# assigned here.
CONFIG_ZTEST=y
CONFIG_I2S=y
CONFIG_AUDIO_PERF_MEASUREMENT=y
CONFIG_ASSERT=y
