CONFIG_ZTEST=y
CONFIG_FPU=y
CONFIG_LIBLC3=y
CONFIG_MAIN_STACK_SIZE=4096
# Timestamp-mode pin waits use sub-interval windows. Native default 100 Hz
# ticks (10 ms) cannot resolve a 10 ms SDU interval.
# 1 kHz ticks let the gate wake within 1 ms of its deadline, matching the
# production margin/lead assumptions.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
