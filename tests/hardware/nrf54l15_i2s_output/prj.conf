# Standalone I2S output test — nRF54L15 I2S20 sine wave, no BLE.
# Minimal config: I2S, slab, UART console, math.

CONFIG_I2S=y
CONFIG_I2S_NRFX=y
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=12

CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n

# FPU for fast sine generation
CONFIG_FPU=y
