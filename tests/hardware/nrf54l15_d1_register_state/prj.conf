# Minimal D1 register-state diagnostic for logic-analyzer capture.
# No BLE, no I2S, no audio — just GPIO + console for boot banner.
# Uses official xiao_nrf54l15 target (UART20 on P1.9/P1.8).

CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Keep image small
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_BT=n
