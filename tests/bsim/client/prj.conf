# BSIM parameterized client — up to two TX streams, source discovery.
CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_SMP=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_UTF8=y
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_UNICAST_CLIENT=y

# Client ASE counts: 3 sink-direction eps (discover 3 server sink ASEs for
# the NO_MEM scenario), 2 source-direction eps (up to two TX streams for
# Mode A).  SRC_COUNT must be 0 or >=2 (upstream BUILD_ASSERT); SNK_COUNT=3
# also selects BT_AUDIO_TX.
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SNK_COUNT=3
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SRC_COUNT=2
CONFIG_BT_BAP_UNICAST_CLIENT_GROUP_STREAM_COUNT=2

# ISO TX — up to 240-byte Mode B SDUs (2 x 120) within 255-byte MTU.
CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_BT_ISO_TX_BUF_COUNT=4
CONFIG_BT_ISO_TX_MTU=255

CONFIG_BT_EXT_ADV=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# ACL/ISO buffer sizes
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_ACL_TX_COUNT=7
CONFIG_BT_CONN_TX_MAX=7

# LIBLC3 encoder support
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=y
CONFIG_LIBLC3=y

# BSIM test framework
CONFIG_BT_TESTING=y
CONFIG_TEST=y

CONFIG_ASSERT=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=y

CONFIG_INFO_REPORTING_INTERVAL=0
