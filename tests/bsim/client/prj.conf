# BSIM client config — single source ASE, 48 kHz LC3, center-only
CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_SMP=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_UTF8=y
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_UNICAST_CLIENT=y

# Client ASE counts: Kconfig requires 0 or >=2 for both.
# ASE_SRC = client source ASEs (TX direction, sends audio to server sink)
# ASE_SNK = client sink ASEs (RX direction, receives from server source — unused)
# ASE_SRC_COUNT=2 required by NCS v3.3.0: unicast group tx_param binding
# fails with 0 Source ASEs (BT_AUDIO_TX is enabled via ASE_SNK path, but
# the local ASE instance must exist for stream TX registration).
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SNK_COUNT=2
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SRC_COUNT=2
CONFIG_BT_BAP_UNICAST_CLIENT_GROUP_STREAM_COUNT=1

# ISO TX — send to receiver (>=120 octets for 48_4_1)
CONFIG_BT_ISO_MAX_CHAN=1
CONFIG_BT_ISO_TX_BUF_COUNT=4
CONFIG_BT_ISO_TX_MTU=255

CONFIG_BT_EXT_ADV=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# ACL/ISO buffer sizes
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_ACL_TX_COUNT=7
CONFIG_BT_CONN_TX_MAX=7

# LIBLC3 encoder support
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=y
CONFIG_LIBLC3=y

# BSIM test framework
CONFIG_BT_TESTING=y
CONFIG_TEST=y

CONFIG_ASSERT=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=y

CONFIG_INFO_REPORTING_INTERVAL=0
