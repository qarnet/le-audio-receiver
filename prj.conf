CONFIG_BT=y
CONFIG_LOG=y
# ACL/ISO buffer sizes matching SW Split controller expectations
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# Buffer counts must match SW Split controller (hci_ipc netcore)
# Controller ACL TX=7, Controller ISO TX=6
CONFIG_BT_BUF_ACL_TX_COUNT=7
CONFIG_BT_CONN_TX_MAX=7
CONFIG_BT_ISO_TX_BUF_COUNT=6

CONFIG_BT_SMP=y
# Allow Just Works pairing (needed for LE Audio)
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# Disable MITM enforcement; Just Works is sufficient for sink device
CONFIG_BT_SMP_ENFORCE_MITM=n

CONFIG_BT_PACS_LOG_LEVEL_WRN=y
CONFIG_BT_ASCS_LOG_LEVEL_WRN=y
CONFIG_BT_BAP_UNICAST_SERVER_LOG_LEVEL_WRN=y
CONFIG_BT_BAP_STREAM_LOG_LEVEL_WRN=y
CONFIG_BT_ISO_LOG_LEVEL_WRN=y
CONFIG_LOG_PRINTK=y


CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=50
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=70
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_UTF8=y
CONFIG_BT_AUDIO=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
CONFIG_BT_PAC_SNK=y
CONFIG_BT_PAC_SNK_LOC=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=2
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=0
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=16
CONFIG_BT_AUDIO_CODEC_CFG_MAX_DATA_SIZE=32
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_EXT_ADV=y
CONFIG_BT_DEVICE_NAME="LE Audio Receiver"

CONFIG_BT_ISO_RX_MTU=255
CONFIG_BT_ISO_RX_BUF_COUNT=6

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=y
CONFIG_LIBLC3=y
CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_I2S=y
CONFIG_I2S_NRFX=y
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=12
CONFIG_I2S_LOG_LEVEL_WRN=y

CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ASSERT=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# Volume Control Profile (VCP) — client-controlled volume
CONFIG_BT_VCP_VOL_REND=y

# Common Audio Service (CAS) — statically registered, no extra code needed
CONFIG_BT_CAP_ACCEPTOR=n  # Disable CAP acceptor context check — bypasses
                          # "Context 0xXXXX is unavailable" rejection in ASE
                          # Enable. TODO: investigate why
                          # bt_pacs_set_available_contexts doesn't make
                          # contexts available at runtime.

# Shell over UART for live diagnostics and scripted testing
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=2048

# Entropy - use simple source, avoid Cryptocell dependency
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# Watchdog — 5 s timeout, fed every 2 s from dedicated thread
CONFIG_WATCHDOG=y
# CONFIG_WDT_NRFX is nRF5340-specific; moved to board conf to avoid
# Kconfig "assigned but got" warning on nRF54L15 (wdt30/wdt31
# disabled in DT when SDC/MPSL in use).

# Stack overflow detection during development
CONFIG_STACK_SENTINEL=y

# Reboot support for board identification fallback
CONFIG_REBOOT=y

