# nRF5340DK hci_uart app-core (cpuapp) configuration fragment.
#
# This fragment is applied on top of the upstream Zephyr hci_uart sample
# (~/ncs/<ver>/zephyr/samples/bluetooth/hci_uart) via
# `-Dhci_uart_EXTRA_CONF_FILE=<this file>`. The sample's own
# boards/nrf5340dk_nrf5340_cpuapp.conf already enables ISO central with
# 18 ISO TX buffers and UART0 @ 1 Mbaud + HW flow control; the lines below
# re-assert the load-bearing ISO symbols so the dongle build is pinned
# against this repo and does not silently regress if the sample's board
# conf changes in a future NCS version.
#
# Built with: fw-build-dongle   (see scripts/bin/fw-build-dongle)

# Connected ISO (central side) — needed so BlueZ can establish CISes for
# LE Audio unicast. Selects BT_ISO / BT_ISO_TX / BT_ISO_RX upstream.
CONFIG_BT_ISO_CENTRAL=y

# Keep the ISO channel/buffer counts aligned with the netcore controller
# (dongle/netcore.conf sets BT_CTLR_CONN_ISO_STREAMS=2). Two CISes for the
# Mode A stereo sink (one per channel).
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_ISO_TX_BUF_COUNT=18
CONFIG_BT_ISO_RX_BUF_COUNT=1

# Extended advertising is required by the receiver (it advertises with
# BT_LE_ADV_OPT_EXT_ADV); without this the controller drops the adv
# reports and discovery never sees the receiver.
CONFIG_BT_EXT_ADV=y