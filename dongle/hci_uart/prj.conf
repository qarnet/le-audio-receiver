# Single-core XIAO nRF54L15 Linux HCI central. UART carries binary H4 only.
CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
# NCS v3.3.0 TIMER-backed initialization declares its runtime swap state
# unconditionally; enabling the supported runtime path initializes that state
# and avoids the SDK's unused-variable diagnostic without suppressing warnings.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# TIMER-backed continuous RX avoids the interrupt-driven one-byte DMA gap.
CONFIG_UART_NRFX_UARTE_BOUNCE_BUF_LEN=1024
# Measured 600 us was insufficient under active CIS scheduling (driver
# assertion at uart_nrfx_uarte.c:1270). Reserve 4 ms of the 5.12 ms half-buffer
# wire time for high-priority controller work before a DMA buffer switch.
CONFIG_UART_NRFX_UARTE_BOUNCE_BUF_SWAP_LATENCY=4000
CONFIG_ASSERT=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=y
# Linux queries advertising-set capacity when Extended Advertising is
# advertised for scanning. SDC must implement that command even though this
# fixture never accepts peripheral connections or starts advertising.
CONFIG_BT_BROADCASTER=y
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_BT_ISO_TX_BUF_COUNT=6
CONFIG_BT_ISO_TX_MTU=255
CONFIG_BT_CTLR_CONN_ISO_GROUPS=1
CONFIG_BT_CTLR_CONN_ISO_STREAMS=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS_PER_GROUP=2
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=0
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=6
CONFIG_BT_CTLR_SDC_ISO_TX_PDU_BUFFER_PER_STREAM_COUNT=6
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_PHY_CODED=n
CONFIG_BT_CTLR_PRIVACY=y
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
