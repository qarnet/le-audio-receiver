# nRF5340DK hci_uart net-core (cpunet / hci_ipc) configuration fragment.
#
# Applied to the hci_ipc child image via
# `-Dhci_ipc_EXTRA_CONF_FILE=<this file>` when building the dongle with
# fw-build-dongle. This is the SoftDevice Controller (SDC) configuration
# that makes the controller usable as an LE Audio central for the
# receiver.
#
# Built with: fw-build-dongle   (see scripts/bin/fw-build-dongle)

# Connected ISO central — pulls in BT_CTLR_CENTRAL_ISO / BT_CTLR_CONN_ISO
# on the SDC side so CISes can be established and ISO data flows.
CONFIG_BT_ISO_CENTRAL=y

# RAM-conscious connection/ISO slot counts. The defaults balloon to 16
# connections and overflow cpunet RAM by ~20 KB; two connections and two
# CISes per group are enough for one stereo unicast sink (Mode A = two
# mono CISes, one per channel).
CONFIG_BT_MAX_CONN=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS_PER_GROUP=2

# One peripheral slot — we only ever connect to the single receiver.
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=1

# Extended advertising support. The receiver advertises with
# BT_LE_ADV_OPT_EXT_ADV; without this the controller cannot report it and
# discovery fails.
CONFIG_BT_EXT_ADV=y

# Linux 7.1 issues extended scan parameters with PHYs=0x05 (1M + Coded,
# active scan on both). The SDC controller strictly rejects active
# scanning on the Coded PHY (HCI error 0x11 Unsupported Feature), which
# kills discovery entirely. Disable Coded so the scan PHY set collapses
# to 1M/2M only.
CONFIG_BT_CTLR_PHY_CODED=n

# Drop LL privacy so the kernel does not enable address resolution —
# keeps the connect path as simple as possible for a test central.
CONFIG_BT_CTLR_PRIVACY=n