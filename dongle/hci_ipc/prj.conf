# nRF5340DK hci_uart dongle — netcore (cpunet / hci_ipc) configuration.
#
# Repo-owned copy of upstream hci_ipc sample prj.conf, merged with
# dongle ISO/controller tuning (was previously in dongle/hci_uart/netcore.conf
# applied via EXTRA_CONF_FILE — now baked into the hci_ipc image config).
#
# Built with: fw-build-dongle
# Uses NETCORE_IMAGE_PATH override to replace upstream hci_ipc sample.

# === Upstream hci_ipc sample defaults ===
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_MAX_CONN=2

# === Dongle ISO / controller tuning (was dongle/hci_uart/netcore.conf) ===

# Connected ISO central — pulls in BT_CTLR_CENTRAL_ISO on the SDC side.
CONFIG_BT_ISO_CENTRAL=y

# RAM-conscious connection/ISO slot counts. Two connections and two
# CISes per group for one stereo unicast sink (Mode A = two mono CISes).
CONFIG_BT_CTLR_CONN_ISO_STREAMS=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS_PER_GROUP=2

# One peripheral slot — we only ever connect to the single receiver.
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=1

# Extended advertising support — receiver advertises with EXT_ADV.
CONFIG_BT_EXT_ADV=y

# Disable Coded PHY — Linux scan parameters with Coded PHY active scan
# cause HCI error 0x11 (Unsupported Feature) on SDC, killing discovery.
CONFIG_BT_CTLR_PHY_CODED=n

# Drop LL privacy — simplest possible test central, no address resolution.
CONFIG_BT_CTLR_PRIVACY=n
