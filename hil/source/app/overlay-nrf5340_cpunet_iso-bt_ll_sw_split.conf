# SPDX-License-Identifier: Apache-2.0
#
# Repository net-core overlay for the dedicated LE Audio source fixture.
# Applied on top of the hci_ipc sample base configuration
# (nrf5340_cpunet_iso_central-bt_ll_sw_split.conf) and may only tighten
# values: the fixture connects to exactly one receiver over two ISO
# streams with six controller TX buffers.

CONFIG_BT_MAX_CONN=1
CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_BT_ISO_TX_BUF_COUNT=6
CONFIG_BT_CTLR_CONN_ISO_GROUPS=1
CONFIG_BT_CTLR_CONN_ISO_STREAMS=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS_PER_GROUP=2
CONFIG_BT_CTLR_ISOAL_SOURCES=2
CONFIG_BT_CTLR_ISO_TX_BUFFERS=6
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=255
CONFIG_BT_CTLR_ISO_TX_SDU_LEN_MAX=247

# Dedicated lab source fixture. Use nRF5340's supported +3 dBm controller
# default so row commissioning does not depend on marginal 0 dBm RF links.
CONFIG_BT_CTLR_TX_PWR_PLUS_3=y

CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_EARLY_CONSOLE=n
