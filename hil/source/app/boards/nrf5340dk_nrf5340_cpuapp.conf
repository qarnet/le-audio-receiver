#
# nRF5340DK cpuapp board conf for the dedicated LE Audio source fixture.
# Mirrors the upstream bap_unicast_client nrf5340dk board conf: the HCI
# buffer sizes must cover the 255-byte ISO MTU and the extended events the
# host exchanges with the SW Split controller.

CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
