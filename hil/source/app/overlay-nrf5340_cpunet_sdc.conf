# SPDX-License-Identifier: Apache-2.0
#
# Repository net-core overlay for the dedicated LE Audio source fixture:
# SoftDevice Controller (SDC) variant. Applied on top of the hci_ipc
# sample base prj.conf (controller-agnostic) instead of any SW-split
# sample configuration. The DT default on nrf5340_cpunet selects the
# SDC node (bt_hci_sdc okay, zephyr,bt-hci chosen), so no snippet and
# no DT overlay is needed; only this Kconfig overlay is applied.
#
# Decision record:
# docs/development/system-hil-rh3-modea10-sdc-handoff.md. The SW-split
# ISO-AL expires (SN_STRICT=y) or time-shifts (SN_STRICT=n) late TX SDUs
# under the completion-paced host at high CIG event duty; ModeA9 proved
# the mechanism and left the row failing frozen limits. SDC is the
# production-grade central ISO controller (BAP-tested per nrfxlib SDC
# isochronous_channels.rst; same shape as nrf5340_audio's SDC netcore +
# BAP unicast client host). Fixture connects to exactly one receiver
# over up to two connected ISO streams, central role only.

CONFIG_BT_BROADCASTER=n
CONFIG_BT_OBSERVER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=n
CONFIG_BT_PER_ADV_SYNC=n
CONFIG_BT_ISO_BROADCASTER=n
CONFIG_BT_ISO_SYNC_RECEIVER=n
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_ISO_PERIPHERAL=n

# Host-side ISO channels for the raw-HCI IPC link. Keep the host ISO TX
# buffer count equal to the controller HCI TX buffer count (six) per the
# upstream sample's Newton's-cradle note.
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_BT_ISO_TX_BUF_COUNT=6
CONFIG_BT_ISO_RX_BUF_COUNT=1

# Controller: SDC (default y on nrf5340 cpunet; DT default node),
# central ISO roles and buffers. One CIG, up to two CIS streams. The
# fixture is the audio source, so its ISO traffic is TX towards the
# receiver sink. Data-length and scan-data-length are SW-split-only
# symbols (BT_LL_SW_SPLIT dependency) and stay unset; SDC manages its
# own data length.
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y

# Connected ISO: central role only. BT_CTLR_CONN_ISO is derived
# (default CENTRAL_ISO || PERIPHERAL_ISO) and not user-assignable;
# the central assignment below drives it. One CIG, up to two CIS
# streams.
CONFIG_BT_CTLR_CENTRAL_ISO=y
CONFIG_BT_CTLR_PERIPHERAL_ISO=n
CONFIG_BT_CTLR_CONN_ISO_GROUPS=1
CONFIG_BT_CTLR_CONN_ISO_STREAMS=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS_PER_GROUP=2

# SDC ISO TX buffer pools. The HCI buffer count is shared across
# streams; its help text recommends larger values for short SDU
# intervals or quick successive sends. Six covers the completion-paced
# host bursts (outstanding target 3 per stream, two streams) and
# matches the app-core CONFIG_BT_ISO_TX_BUF_COUNT=6, keeping the three
# depths equal per the repo buffer-matching policy. PDU buffers per
# stream cover subevent pre-transmission and retransmission margin
# (SDC default 3 raised to the previous SW-split pool depth intent).
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=6
CONFIG_BT_CTLR_SDC_ISO_TX_PDU_BUFFER_PER_STREAM_COUNT=6

# SDC role counts: central-only fixture (zero peripheral roles).
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=0

# Clear application-core RTC0 when MPSL starts the controller RTC. The source
# scheduler uses this mirrored clock instead of deriving controller-now from an
# already-scheduled SDU timestamp.
CONFIG_MPSL_TRIGGER_IPC_TASK_ON_RTC_START=y
CONFIG_MPSL_TRIGGER_IPC_TASK_ON_RTC_START_CHANNEL=4

# TX power: +3 dBm, the nRF5340 maximum, keeps the fixture RF margin the
# SW-split build had (CONFIG_BT_CTLR_TX_PWR_PLUS_3). Under SDC the
# Zephyr TX_PWR choice is still consumed (nrf radio_nrf5_txp.h maps it
# to sdc_default_tx_power_set()), but its default is 0 dBm, so the
# assignment is required.
CONFIG_BT_CTLR_TX_PWR_PLUS_3=y

# Net core is silent; the app core owns the HIL1 console.
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_EARLY_CONSOLE=n
